services:
  app:
    build: .
    ports:
      - "5050:5050"
    environment:
      - NODE_ENV=production
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4318
    depends_on:
      - otel-lgtm
    restart: unless-stopped

  otel-lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3001:3000"   # Grafana UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    restart: unless-stopped
